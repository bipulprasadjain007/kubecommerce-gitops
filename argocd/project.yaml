# Argo CD AppProject for KubeCommerce (guide Phase 8, Step 8.1).
#
# This project is the blast-radius boundary for every environment Application.
# It is created by the root app-of-apps (argocd/root-app.yaml) and then used by
# the Applications generated by argocd/applicationset.yaml.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kubecommerce
  namespace: argocd
  annotations:
    # Applied before every child Application in the root app-of-apps sync.
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/part-of: kubecommerce
  finalizers:
    # Deleting the AppProject deletes its Applications and their child resources.
    - resources-finalizer.argocd.argoproj.io
spec:
  description: KubeCommerce application environments and shared platform manifests.
  # The GitOps repository plus the pinned upstream Helm chart repositories used
  # by the platform Applications (versions are pinned on each Application, so
  # allowing these repos does not float versions). Replace the git placeholder
  # before syncing (see bootstrap/argocd/README.md).
  sourceRepos:
    - https://github.com/your-github-username/kubecommerce-gitops.git
    - https://prometheus-community.github.io/helm-charts # kube-prometheus-stack, exporters
    - https://grafana.github.io/helm-charts # Loki, Alloy, Tempo
    - https://grafana-community.github.io/helm-charts # Loki/Tempo (community charts)
    - https://open-telemetry.github.io/opentelemetry-helm-charts # OTel Collector
  # Allowed deployment targets. The three application namespaces plus the shared
  # platform namespaces the platform apps deploy into. `argocd` is included
  # because the nested platform app-of-apps (`argocd/platform-apps/*`) creates
  # its child Application objects there; the blast radius is bounded by the
  # namespace-scoped allow-list below (an Application is only a control object
  # and all child resources are still subject to this project's rules).
  destinations:
    - namespace: kubecommerce-dev
      server: https://kubernetes.default.svc
    - namespace: kubecommerce-staging
      server: https://kubernetes.default.svc
    - namespace: kubecommerce-prod
      server: https://kubernetes.default.svc
    - namespace: platform-system
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: observability
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  # Minimal namespace-scoped allow-list: exactly the kinds the app chart and the
  # planned platform manifests create. Anything not listed is denied by Argo CD.
  namespaceResourceWhitelist:
    # Required by the nested platform app-of-apps (platform-infrastructure and
    # platform-observability create their child Applications in `argocd`).
    - group: argoproj.io
      kind: Application
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet # node-exporter, Alloy
    - group: batch
      kind: Job # Alembic migration Job
    - group: batch
      kind: CronJob
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: PodMonitor # OTel Collector / exporters
    - group: monitoring.coreos.com
      kind: Probe
    - group: monitoring.coreos.com
      kind: AlertmanagerConfig
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: ThanosRuler
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      kind: Gateway
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
    - group: external-secrets.io
      kind: ExternalSecret
  # Cluster-scoped kinds are denied by default. The list is kept minimal but now
  # includes what the observability stack genuinely needs:
  #   Namespace                - platform/namespaces/namespaces.yaml
  #   GatewayClass             - platform/gateway/gatewayclass.yaml
  #   CustomResourceDefinition - Gateway API / Prometheus Operator CRDs
  #   ClusterRole(Binding)     - Prometheus Operator, exporters, Alloy (read pods/logs)
  #   WebhookConfigurations    - Prometheus Operator admission webhooks
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
