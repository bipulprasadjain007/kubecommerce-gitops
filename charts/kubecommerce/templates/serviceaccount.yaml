{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- if $svc.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubecommerce.serviceAccountName" (dict "root" $root "name" $name "svc" $svc) }}
  labels:
    {{- include "kubecommerce.labels" (dict "root" $root "name" $name "svc" $svc) | nindent 4 }}
  {{- $saAnnotations := merge (deepCopy ($svc.serviceAccount.annotations | default dict)) ($root.Values.global.serviceAccount.annotations | default dict) }}
  {{- if $saAnnotations }}
  annotations:
    {{- toYaml $saAnnotations | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $svc.serviceAccount.automount | default false }}
{{- end }}
{{- end }}
{{- end }}
