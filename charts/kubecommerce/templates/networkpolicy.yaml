{{- $root := . -}}
{{- if $root.Values.global.networkPolicy.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.networkPolicy.enabled }}
---
# Default-deny: no traffic is allowed in or out of these pods unless another
# NetworkPolicy selecting them explicitly allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-default-deny
  labels:
    {{- include "kubecommerce.labels" (dict "root" $root "name" $name "svc" $svc) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubecommerce.selectorLabels" (dict "root" $root "name" $name) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
# Explicit allows for this service (ingress from callers, egress to infra and
# collaborators). Composed from values + global infra peer configuration.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-allow
  labels:
    {{- include "kubecommerce.labels" (dict "root" $root "name" $name "svc" $svc) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubecommerce.selectorLabels" (dict "root" $root "name" $name) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "kubecommerce.ingressRules" (dict "root" $root "name" $name "svc" $svc) | nindent 4 }}
  egress:
    {{- include "kubecommerce.egressRules" (dict "root" $root "name" $name "svc" $svc) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
