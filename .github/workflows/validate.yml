name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.22.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  ACTIONLINT_VERSION: v1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  KYVERNO_VERSION: v1.19.1
  # SHA-256 of kyverno-cli_v1.19.1_linux_x86_64.tar.gz (verified locally).
  KYVERNO_CLI_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae

jobs:
  helm-validate:
    name: helm-validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: helm lint (dev, staging, prod)
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            echo "::group::helm lint ${env}"
            helm lint charts/kubecommerce --strict -f "environments/${env}/values.yaml"
            echo "::endgroup::"
          done

      - name: helm template | kubeconform (dev, staging, prod)
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            echo "::group::helm template ${env}"
            helm template kubecommerce charts/kubecommerce \
              -n "kubecommerce-${env}" \
              -f "environments/${env}/values.yaml" \
              | kubeconform -strict -summary -ignore-missing-schemas
            echo "::endgroup::"
          done

  manifest-validate:
    name: manifest-validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: kubeconform argocd and platform manifests
        run: |
          set -euo pipefail
          kubeconform -strict -summary -ignore-missing-schemas \
            argocd/ \
            platform/gateway/ \
            platform/infrastructure/ \
            platform/namespaces/ \
            platform/monitoring/alert-sink/ \
            platform/monitoring/rules/ \
            platform/monitoring/dashboards/ \
            platform/observability-apps/ \
            platform/policies/tests/ \
            platform/policies/apps/ \
            platform/policies/policies/ \
            platform/cloud-apps/ \
            platform/external-secrets/ \
            platform/cert-manager/

      - name: YAML parse (manifests only, values files excluded)
        run: |
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          # Helm values files are not Kubernetes manifests and are excluded from
          # schema/YAML manifest validation on purpose.
          VALUES_FILES = {
              "platform/exporters/postgres-exporter-values.yaml",
              "platform/exporters/redis-exporter-values.yaml",
              "platform/logging/alloy-values.yaml",
              "platform/logging/loki-values.yaml",
              "platform/monitoring/kps-values.yaml",
              "platform/observability/otel-collector-values.yaml",
              "platform/tracing/tempo-values.yaml",
          }

          files = sorted(
              glob.glob("argocd/**/*.yaml", recursive=True)
              + glob.glob("platform/**/*.yaml", recursive=True)
          )

          errors = 0
          checked = 0
          for path in files:
              if path in VALUES_FILES:
                  continue
              checked += 1
              try:
                  list(yaml.safe_load_all(open(path, encoding="utf-8")))
              except Exception as exc:  # noqa: BLE001
                  errors += 1
                  print(f"FAIL {path}: {exc}")
          print(f"YAML parse: {checked} manifest(s) checked, {errors} error(s)")
          sys.exit(1 if errors else 0)
          PY

  yaml-hygiene:
    name: yaml-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: YAML parse (manifests only, values files excluded)
        run: |
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          VALUES_FILES = {
              "platform/exporters/postgres-exporter-values.yaml",
              "platform/exporters/redis-exporter-values.yaml",
              "platform/logging/alloy-values.yaml",
              "platform/logging/loki-values.yaml",
              "platform/monitoring/kps-values.yaml",
              "platform/observability/otel-collector-values.yaml",
              "platform/tracing/tempo-values.yaml",
          }

          files = sorted(
              glob.glob("argocd/**/*.yaml", recursive=True)
              + glob.glob("platform/**/*.yaml", recursive=True)
          )

          errors = 0
          checked = 0
          for path in files:
              if path in VALUES_FILES:
                  continue
              checked += 1
              try:
                  list(yaml.safe_load_all(open(path, encoding="utf-8")))
              except Exception as exc:  # noqa: BLE001
                  errors += 1
                  print(f"FAIL {path}: {exc}")
          print(f"YAML parse: {checked} manifest(s) checked, {errors} error(s)")
          sys.exit(1 if errors else 0)
          PY

      - name: Reject trailing whitespace
        run: |
          set -euo pipefail
          if grep -rInE ' +$' \
              --include='*.yaml' --include='*.yml' \
              argocd platform charts environments .github; then
            echo "::error::trailing whitespace found in the files listed above"
            exit 1
          fi
          echo "No trailing whitespace found"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Run actionlint on this workflow
        run: actionlint -color .github/workflows/validate.yml

  policy-validate:
    name: policy-validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install pinned Kyverno CLI
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/kyverno-cli.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_CLI_SHA256}  /tmp/kyverno-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kyverno-cli.tar.gz -C /tmp kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Render the hardened dev chart and stamp the render namespace
        run: |
          set -euo pipefail
          helm template kubecommerce charts/kubecommerce \
            -n kubecommerce-dev \
            -f environments/dev/values.yaml > /tmp/kc-dev.yaml
          # `helm template` omits metadata.namespace, but the policies are
          # namespace-scoped. Stamp the render namespace so the gate actually
          # exercises them (the ClusterPolicies cannot match a namespace-less
          # render, which would make the check vacuous).
          python3 - <<'PY'
          import yaml

          CLUSTER_SCOPED = {
              "Namespace",
              "ClusterRole",
              "ClusterRoleBinding",
              "CustomResourceDefinition",
              "ValidatingWebhookConfiguration",
              "MutatingWebhookConfiguration",
          }
          docs = [d for d in yaml.safe_load_all(open("/tmp/kc-dev.yaml")) if d]
          for doc in docs:
              if doc.get("kind") not in CLUSTER_SCOPED:
                  doc.setdefault("metadata", {})["namespace"] = "kubecommerce-dev"
          with open("/tmp/kc-dev-ns.yaml", "w") as handle:
              yaml.safe_dump_all(docs, handle, sort_keys=False)
          PY

      - name: Hardened chart must satisfy every policy (expect no violations)
        run: |
          set -euo pipefail
          set +e
          kyverno apply platform/policies/policies --resource /tmp/kc-dev-ns.yaml | tee /tmp/kyverno-chart.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "::error::the hardened chart violated a policy (exit ${rc})"
            exit 1
          fi
          if ! grep -qE "fail: 0, warn: 0, error: 0" /tmp/kyverno-chart.txt; then
            echo "::error::policy summary is not clean"
            grep -E "pass:|fail:" /tmp/kyverno-chart.txt || true
            exit 1
          fi
          if ! grep -qE "pass: [1-9]" /tmp/kyverno-chart.txt; then
            echo "::error::no policy rule matched the rendered chart; policies are not being exercised"
            exit 1
          fi

      - name: Insecure fixture must be rejected by every policy (exact count)
        run: |
          set -euo pipefail
          set +e
          kyverno apply platform/policies/policies \
            --resource platform/policies/tests/insecure-deployment.yaml | tee /tmp/kyverno-insecure.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "${rc}" -eq 0 ]; then
            echo "::error::the deliberately insecure fixture was NOT rejected"
            exit 1
          fi
          # Exact expected violation count: one per policy (10).
          if ! grep -qE "fail: 10, warn: 0, error: 0" /tmp/kyverno-insecure.txt; then
            echo "::error::expected exactly 10 violations for the insecure fixture"
            tail -1 /tmp/kyverno-insecure.txt || true
            exit 1
          fi
          # Every policy must produce a violation, so deleting a policy cannot pass.
          for policy in \
            kubecommerce-disallow-privileged-containers \
            kubecommerce-disallow-mutable-image-tags \
            kubecommerce-require-run-as-non-root \
            kubecommerce-require-resource-requests-limits \
            kubecommerce-require-readiness-liveness-probes \
            kubecommerce-restrict-image-registries \
            kubecommerce-require-seccomp-runtime-default \
            kubecommerce-require-readonly-root-filesystem \
            kubecommerce-disallow-hostpath-hostnetwork \
            kubecommerce-require-drop-all-capabilities ; do
            if ! grep -q "policy ${policy} ->" /tmp/kyverno-insecure.txt; then
              echo "::error::policy ${policy} did not fire on the insecure fixture"
              exit 1
            fi
          done
          echo "Insecure fixture rejected: 10 violations across 10 policies (exit ${rc})."

      - name: Compliant fixture must pass every policy
        run: |
          set -euo pipefail
          kyverno apply platform/policies/policies \
            --resource platform/policies/tests/compliant-workload.yaml | tee /tmp/kyverno-compliant.txt
          if ! grep -qE "fail: 0, warn: 0, error: 0" /tmp/kyverno-compliant.txt; then
            echo "::error::the compliant fixture violated a policy"
            exit 1
          fi
          if ! grep -qE "pass: [1-9]" /tmp/kyverno-compliant.txt; then
            echo "::error::no policy rule matched the compliant fixture"
            exit 1
          fi
          echo "Compliant fixture passed every policy."

      - name: OTel collector must be hardened and outside the policy scope
        run: |
          set -euo pipefail
          helm template otel-collector opentelemetry-collector \
            --repo https://open-telemetry.github.io/opentelemetry-helm-charts \
            --version 0.173.1 \
            -n observability \
            -f platform/observability/otel-collector-values.yaml > /tmp/otel.yaml
          # P1 regression guard: the rendered Pod must carry the hardened context.
          for needle in \
            "runAsNonRoot: true" \
            "readOnlyRootFilesystem: true" \
            "allowPrivilegeEscalation: false" \
            "type: RuntimeDefault" \
            "- ALL" ; do
            if ! grep -q -- "${needle}" /tmp/otel.yaml; then
              echo "::error::OTel collector render is missing hardening: ${needle}"
              exit 1
            fi
          done
          # `observability` is outside the namespace-bounded policy scope: the
          # collector must not be matched, and must produce zero violations.
          kyverno apply platform/policies/policies --resource /tmp/otel.yaml | tee /tmp/kyverno-otel.txt
          if ! grep -qE "fail: 0, warn: 0, error: 0" /tmp/kyverno-otel.txt; then
            echo "::error::policies unexpectedly flagged the out-of-scope OTel collector"
            exit 1
          fi
          echo "OTel collector hardened and correctly outside the policy scope."
