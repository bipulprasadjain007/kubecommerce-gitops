# Argo CD Application for in-cluster RabbitMQ (platform-system).
#
# See apps/postgres-application.yaml for the general application conventions
# (plain Application, env-specific automation, managed-service note).
# In staging/prod, replace with AmazonMQ (RabbitMQ) and disable this Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubecommerce-rabbitmq
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/component: shared-infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubecommerce
  source:
    # Placeholder: replace with the real GitOps repository URL.
    repoURL: https://github.com/your-github-username/kubecommerce-gitops.git
    targetRevision: main
    path: platform/infrastructure/rabbitmq
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
