# =============================================================================
# PostgreSQL 16 (official postgres:16-alpine image) for the local kind cluster.
#
# One instance hosts three databases (auth_db, catalog_db, orders_db) created by
# the init ConfigMap in this directory. See docs/architecture.md section 4 for
# the one-instance/three-databases ownership model.
#
# The Service in service.yaml is named exactly `postgres` so the application
# services reach it at:
#   postgres.platform-system.svc.cluster.local:5432
#
# Credentials come from a single pre-created Secret `kubecommerce-infra-secrets`
# (key: postgres-password). NOTHING secret is committed; see secret.example.yaml
# and README.md for the exact `kubectl create secret` command (guide Step 6.1).
#
# Pod/Service labels intentionally include `app.kubernetes.io/name: postgresql`
# (and app.kubernetes.io/part-of: kubecommerce) so the app chart's NetworkPolicy
# peer selectors match (charts/kubecommerce/values.yaml global.networkPolicy).
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: platform-system
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: kubecommerce-infra
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: kubecommerce-infra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: kubecommerce-infra
        app.kubernetes.io/part-of: kubecommerce
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Official postgres:16-alpine image creates `postgres` as uid/gid 70.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: kubecommerce
            # The bootstrap database; auth_db/catalog_db/orders_db are created by
            # the init ConfigMap below.
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubecommerce-infra-secrets
                  key: postgres-password
            # Keep PGDATA in a subdirectory: the volume root may contain
            # lost+found (ext4) which initdb refuses to use.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # readOnlyRootFilesystem requires writable socket + tmp dirs.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/instance: kubecommerce-infra
          app.kubernetes.io/part-of: kubecommerce
      spec:
        accessModes:
          - ReadWriteOnce
        # No storageClassName => the cluster's default StorageClass is used:
        #   kind  -> `standard` (local-path-provisioner)
        #   EKS   -> `gp3` (or `gp2`)
        # To pin explicitly, uncomment and set the value for your cluster:
        # storageClassName: standard
        resources:
          requests:
            storage: 5Gi
