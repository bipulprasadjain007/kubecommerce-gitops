# =============================================================================
# EXAMPLE ONLY - NOT FOR `kubectl apply`.
#
# This file documents the shape of the Secret the infrastructure manifests
# expect. It contains placeholder values (`CHANGE_ME`) and MUST NOT be applied
# as-is, and MUST NEVER be replaced with real credentials and committed.
#
# The real Secret is created OUT OF BAND (guide Step 6.1: "generated Kubernetes
# Secrets excluded from Git"). Exact command:
#
#   export PATH="$HOME/.local/bin:$PATH"
#   kubectl -n platform-system create secret generic kubecommerce-infra-secrets \
#     --from-literal=postgres-password="$(openssl rand -base64 24)" \
#     --from-literal=redis-password="$(openssl rand -base64 24)" \
#     --from-literal=rabbitmq-password="$(openssl rand -base64 24)"
#
# Postgres/Redis/RabbitMQ read this Secret at pod start; changing a value
# requires deleting the pod (and, for Postgres/RabbitMQ, is only applied to a
# fresh data directory - see README.md "Rotating credentials").
#
# If you prefer manifest-based creation: apply this file once, then immediately
# replace the placeholders, e.g.
#   kubectl -n platform-system create secret generic kubecommerce-infra-secrets \
#     --from-literal=... --dry-run=client -o yaml | kubectl apply -f -
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kubecommerce-infra-secrets
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/component: shared-infrastructure
    app.kubernetes.io/managed-by: manual
type: Opaque
stringData:
  postgres-password: CHANGE_ME
  redis-password: CHANGE_ME
  rabbitmq-password: CHANGE_ME
