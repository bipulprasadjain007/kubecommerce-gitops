# KubeCommerce platform namespaces (guide Phase 4, Step 4.2).
#
# Plain manifests applied idempotently (e.g. `kubectl apply -f namespaces.yaml`
# or via the Argo CD app-of-apps). Deliberately NOT Helm-managed: namespaces must
# exist before Helm releases / Argo CD can target them, so keeping them as raw
# YAML avoids a bootstrap chicken-and-egg with `CreateNamespace=false`.
#
# The seven namespaces are the locked set from docs/architecture.md §11:
#   kubecommerce-dev | kubecommerce-staging | kubecommerce-prod
#   platform-system | monitoring | observability | argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubecommerce-dev
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
    environment: dev
    # Pod Security Admission. `enforce: baseline` blocks the most dangerous
    # privileges (privileged/hostPath/hostNetwork) without breaking third-party
    # sidecars mid-migration; `warn`/`audit: restricted` surfaces, but does not
    # block, every deviation from the hardened target. The version labels are
    # intentionally omitted so each cluster uses its own latest policy version.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubecommerce-staging
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
    environment: staging
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubecommerce-prod
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
    environment: prod
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# platform-system hosts the north-south Gateway (Envoy data plane) and other
# shared platform controllers. No PSA override: it inherits the cluster default.
# Envoy's data plane needs NET_BIND_SERVICE, which is still allowed under
# `baseline`, so no relaxation is required here.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
---
# monitoring / observability are owned by the observability phase (Prometheus,
# Grafana, Loki, Tempo, OTel). They intentionally carry no PSA override because
# node-level agents (node-exporter, log/trace collectors) may require hostPath or
# hostNetwork privileges. Owners of those manifests must set the appropriate
# `pod-security.kubernetes.io/enforce` label there when they add them.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
---
# argocd hosts the Argo CD control plane installed by bootstrap/argocd/install.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
---
# kyverno hosts the Kyverno policy engine (guide Phase 12.4). Created here, with
# the namespaces Application at wave -5, so the Kyverno and ClusterPolicy
# Applications (waves -2 and -1) can target it with CreateNamespace=false.
# Kyverno's own controllers ship a hardened securityContext; `audit`/`warn`
# surface deviations from `restricted` without blocking admission.
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# external-secrets / cert-manager are installed by the cloud Applications
# (platform/cloud-apps) and stay inert on kind unless explicitly synced.
# Both ship hardened securityContexts, so `enforce: baseline` (with
# warn/audit restricted) matches the other platform namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/managed-by: argocd
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
