# HTTPRoutes: one per environment namespace (guide Phase 4, Step 4.10).
#
# These are the single north-south entry routes. Each routes all traffic on "/"
# to the `gateway-api` Service in the SAME namespace (port 80 -> container 8000).
# The gateway-api service is the only public component (docs/architecture.md §6);
# everything else stays ClusterIP-only.
#
# NOTE: the lane-2 Helm chart may optionally emit per-service HTTPRoutes. If it
# does, it must be disabled for the north-south edge so these platform routes
# remain the single source of truth (avoid two routes claiming the same host+path).
#
# ReferenceGrant: NOT required here and therefore not created.
#   - parentRef (HTTPRoute -> Gateway in platform-system) is cross-namespace, but
#     Gateway API authorises it via the Gateway listener's allowedRoutes, not via
#     ReferenceGrant.
#   - each backendRef (`gateway-api`) lives in the SAME namespace as its route, so
#     no cross-namespace backend reference exists.
#   Add a ReferenceGrant only if a backendRef is ever pointed at a Service in a
#   different namespace.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-api
  namespace: kubecommerce-dev
  labels:
    app.kubernetes.io/part-of: kubecommerce
    environment: dev
spec:
  parentRefs:
    - name: kubecommerce-gateway
      namespace: platform-system
      sectionName: http
    # Cloud/AWS: also attach the route to the Gateway's HTTPS listener so the
    # same paths are served over TLS. Leave commented on kind (no certificate
    # exists there). Uncomment together with the hostname below.
    # - name: kubecommerce-gateway
    #   namespace: platform-system
    #   sectionName: https
  # Optional cloud host pinning (matches the Gateway's https listener hostname).
  # Uncomment to enforce the host over HTTPS; use kubecommerce-<env>.<domain>
  # when each environment gets its own cluster/domain. Local kind keeps no
  # hostname so any Host header matches and http://localhost/ works.
  # hostnames:
  #   - kubecommerce.<domain>
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-api
  namespace: kubecommerce-staging
  labels:
    app.kubernetes.io/part-of: kubecommerce
    environment: staging
spec:
  parentRefs:
    - name: kubecommerce-gateway
      namespace: platform-system
      sectionName: http
  # Cloud/AWS: also attach to the HTTPS listener (uncomment together with the
  # hostname). See the dev route above for details.
  # - name: kubecommerce-gateway
  #   namespace: platform-system
  #   sectionName: https
  # hostnames:
  #   - kubecommerce.<domain>
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-api
  namespace: kubecommerce-prod
  labels:
    app.kubernetes.io/part-of: kubecommerce
    environment: prod
spec:
  parentRefs:
    - name: kubecommerce-gateway
      namespace: platform-system
      sectionName: http
  # Cloud/AWS: also attach to the HTTPS listener (uncomment together with the
  # hostname). See the dev route above for details.
  # - name: kubecommerce-gateway
  #   namespace: platform-system
  #   sectionName: https
  # hostnames:
  #   - kubecommerce.<domain>
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway-api
          port: 80
