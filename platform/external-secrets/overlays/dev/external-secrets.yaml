    name: order-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: ORDERS_DATABASE_URL
      remoteRef:
        key: /dev/kubecommerce/database/orders-url
    - secretKey: ORDERS_RABBITMQ_URL
      remoteRef:
        key: /dev/kubecommerce/rabbitmq/orders-url
    - secretKey: ORDERS_INTERNAL_API_TOKEN
      remoteRef:
        key: /dev/kubecommerce/internal/api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
