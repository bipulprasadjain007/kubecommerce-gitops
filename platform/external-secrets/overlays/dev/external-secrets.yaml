# =============================================================================
# KubeCommerce DEV - ExternalSecrets (guide Phase 13, Step 13.2; Phase 6.2).
#
# Materialises EXACTLY the five `<service>-secrets` Secrets the app chart
# consumes in namespace kubecommerce-dev (charts/kubecommerce/values.yaml
# `secretEnvFrom`). The Secret keys are the environment variables the services
# read; the AWS Secrets Manager paths follow the guide's Phase 6.2 convention:
#
#   /<env>/kubecommerce/<area>/<name>
#
# DEV uses the `/dev/...` prefix. Staging/prod are identical apart from the
# prefix and namespace (see overlays/staging/ and overlays/prod/).
#
# The local kind cluster keeps using `make k8s-secrets`
# (scripts/k8s-dev-secrets.sh) for those same Secrets - the cloud path is
# additive and inert until an operator syncs platform/cloud-apps.
#
# TOKEN COUPLING: gateway -> order and order -> catalog currently reuse ONE
# internal token (the services verify and send the same value), so all three
# `*_INTERNAL_API_TOKEN` keys deliberately resolve from the same Secrets
# Manager entry `/dev/kubecommerce/internal/api-token`; a single rotation keeps
# them equal. If an entry must be per-service, add a `remoteRef.property` or
# split the path.
#
# Rotate: update the value in AWS Secrets Manager; ESO re-syncs within
# `refreshInterval` (1h) and rewrites the Kubernetes Secret. The running pods
# do NOT hot-reload environment variables - restart them:
#   kubectl -n kubecommerce-dev rollout restart deploy
# =============================================================================
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-secrets
  namespace: kubecommerce-dev
  labels:
    app.kubernetes.io/part-of: kubecommerce
    environment: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: auth-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_DATABASE_URL
      remoteRef:
        key: /dev/kubecommerce/database/auth-url
    - secretKey: AUTH_JWT_PRIVATE_KEY
      remoteRef:
        key: /dev/kubecommerce/auth/jwt-signing-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-service-secrets
  namespace: kubecommerce-dev
  labels:
    app.kubernetes.io/part-of: kubecommerce
    environment: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: catalog-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: CATALOG_DATABASE_URL
      remoteRef:
        key: /dev/kubecommerce/database/catalog-url
    - secretKey: CATALOG_REDIS_URL
      remoteRef:
        key: /dev/kubecommerce/redis/catalog-url
    - secretKey: CATALOG_INTERNAL_API_TOKEN
      remoteRef:
        key: /dev/kubecommerce/internal/api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-secrets
  namespace: kubecommerce-dev
  labels:
    app.kubernetes.io/part-of: kubecommerce
