      remoteRef:
        key: /staging/kubecommerce/database/orders-url
    - secretKey: ORDERS_RABBITMQ_URL
      remoteRef:
        key: /staging/kubecommerce/rabbitmq/orders-url
    - secretKey: ORDERS_INTERNAL_API_TOKEN
      remoteRef:
        key: /staging/kubecommerce/internal/api-token
---
