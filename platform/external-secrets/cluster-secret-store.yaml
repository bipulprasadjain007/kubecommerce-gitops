# ClusterSecretStore: AWS Secrets Manager (guide Phase 13, Step 13.2).
#
# One cluster-scoped store shared by every environment in the cluster. The
# ExternalSecrets in overlays/<env>/ reference it via:
#   secretStoreRef:
#     name: aws-secretsmanager
#     kind: ClusterSecretStore
#
# ---------------------------------------------------------------------------
# AUTHENTICATION - EKS Pod Identity (no static AWS keys anywhere)
# ---------------------------------------------------------------------------
# This cluster uses EKS Pod Identity: Terraform creates an
# `aws_eks_pod_identity_association` for ServiceAccount `external-secrets` in
# namespace `external-secrets` (the ESO controller SA created by the pinned
# Helm chart in platform/cloud-apps/external-secrets.yaml).
#
# With Pod Identity the AWS SDK inside ESO obtains temporary credentials from
# the node's Pod Identity Agent, so this store needs NO `auth` block at all.
# Per the ESO docs, `auth.jwt.serviceAccountRef` is an IRSA-only mechanism and
# must NOT be used together with Pod Identity (it would bypass/break the Pod
# Identity credential flow).
#
# The IAM role needs secretsmanager:GetSecretValue (+ DescribeSecret) on the
# configured secret prefix only (principle of least privilege).
#
# ---------------------------------------------------------------------------
# IRSA ALTERNATIVE (only if NOT using the Pod Identity association above)
# ---------------------------------------------------------------------------
# For IRSA: do not create the Pod Identity association; annotate the ESO
# ServiceAccount with `eks.amazonaws.com/role-arn: <eks_eso_role_arn>` and add
# the `auth.jwt.serviceAccountRef` block under `spec.provider.aws` below. The
# exact snippet (kept out of this manifest on purpose, so the file contains no
# authentication block for the Pod Identity path) is in
# platform/external-secrets/README.md → "Workload identity".
#
# ---------------------------------------------------------------------------
# REGION - PLACEHOLDER, OVERRIDE PER CLUSTER
# ---------------------------------------------------------------------------
# Replace `<aws-region>` with the Terraform `region` output, e.g. us-east-1.
# A ClusterSecretStore is cluster-scoped, so there is exactly one per cluster
# and it always describes the region that cluster runs in: it is NOT a
# per-namespace/per-environment value. If you deploy one cluster per
# environment you edit this single line per cluster (or, if you prefer
# per-environment stores, copy this file to overlays/<env>/ and give each a
# distinct metadata.name + region, then point that env's ExternalSecrets at
# it). The default keeps a single store so the common single-cluster demo
# works unchanged.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/component: secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: <aws-region>
      # No `auth` block: credentials come from the EKS Pod Identity association
      # on the `external-secrets` ServiceAccount. The IRSA alternative is
      # documented in platform/external-secrets/README.md.
