# Alert sink script (ConfigMap) - mounted read-only into the alert-sink pod.
#
# Stdlib-only Python 3 HTTP server that receives Alertmanager webhook POSTs.
# Endpoints:
#   POST   /alerts    append every Alertmanager webhook payload (>=HTTP 202)
#   GET    /alerts    JSON list of everything received (in memory)
#   DELETE /alerts    clear the in-memory buffer
#   GET    /health    liveness/readiness probe
#
# One structured JSON log line is emitted per received webhook and per access so
# the sink doubles as a `kubectl logs deployment/alert-sink` log sink.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-sink-script
  namespace: observability
  labels:
    app.kubernetes.io/name: alert-sink
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/component: alerting
    app.kubernetes.io/managed-by: argocd
data:
  alert_sink.py: |-
    #!/usr/bin/env python3
    """Minimal in-cluster Alertmanager webhook sink (stdlib only).

    Receives Alertmanager webhook notifications, keeps them in memory for the
    demo and logs a structured JSON line per event. There is deliberately no
    persistence: a restart clears the buffer.
    """

    from __future__ import annotations

    import json
    import logging
    import os
    import signal
    import sys
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from typing import Any

    LOG = logging.getLogger("alert-sink")

    _LOCK = threading.Lock()
    _ALERTS: list[dict[str, Any]] = []
    _MAX_ALERTS = int(os.environ.get("ALERT_SINK_MAX_ALERTS", "1000"))


    class AlertSinkHandler(BaseHTTPRequestHandler):
        """Tiny JSON HTTP handler for the four sink endpoints."""

        server_version = "kubecommerce-alert-sink/1.0"

        # -- helpers ---------------------------------------------------------
        def _send(self, code: int, payload: dict[str, Any]) -> None:
            body = json.dumps(payload).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def _read_json(self) -> dict[str, Any] | None:
            length = int(self.headers.get("Content-Length") or 0)
            if length <= 0:
                return None
            try:
                parsed = json.loads(self.rfile.read(length))
            except json.JSONDecodeError:
                return None
            return parsed if isinstance(parsed, dict) else None

        def _path(self) -> str:
            return self.path.split("?", 1)[0].rstrip("/") or "/"

        def _log(self, event: str, **fields: Any) -> None:
            LOG.info(json.dumps({"event": event, **fields}, separators=(",", ":")))

        @staticmethod
        def _names(payload: dict[str, Any]) -> list[str]:
            alerts = payload.get("alerts")
            if not isinstance(alerts, list):
                return []
            return [
                str(a.get("labels", {}).get("alertname", "unknown"))
                for a in alerts
                if isinstance(a, dict)
            ]

        # -- routes ----------------------------------------------------------
        def do_GET(self) -> None:  # noqa: N802 (http.server API)
            path = self._path()
            if path == "/health":
                with _LOCK:
                    count = len(_ALERTS)
                self._send(200, {"status": "ok", "alerts": count})
            elif path == "/alerts":
                with _LOCK:
                    snapshot = list(_ALERTS)
                self._send(200, {"count": len(snapshot), "alerts": snapshot})
            else:
                self._send(404, {"error": "not found", "path": path})

        def do_POST(self) -> None:  # noqa: N802 (http.server API)
            if self._path() != "/alerts":
                self._send(404, {"error": "not found", "path": self._path()})
                return
            payload = self._read_json()
            if payload is None:
                self._send(400, {"error": "invalid or empty JSON body"})
                return
            with _LOCK:
                _ALERTS.append(payload)
                # Ring-buffer trim: keep the newest _MAX_ALERTS payloads.
                del _ALERTS[:-_MAX_ALERTS]
                count = len(_ALERTS)
            self._log(
                "alert_received",
                status=payload.get("status"),
                receiver=payload.get("receiver"),
                groupKey=payload.get("groupKey"),
                alerts=self._names(payload),
                stored=count,
            )
            self._send(202, {"status": "accepted", "stored": count})

        def do_DELETE(self) -> None:  # noqa: N802 (http.server API)
            if self._path() != "/alerts":
                self._send(404, {"error": "not found", "path": self._path()})
                return
            with _LOCK:
                cleared = len(_ALERTS)
                _ALERTS.clear()
            self._log("alerts_cleared", cleared=cleared)
            self._send(200, {"status": "cleared", "cleared": cleared})

        def log_message(self, fmt: str, *args: Any) -> None:
            # Suppress the default stderr access log; emit one JSON line instead.
            self._log(
                "http_access",
                client=self.client_address[0] if self.client_address else None,
                message=fmt % args,
            )


    def main() -> None:
        logging.basicConfig(
            level=os.environ.get("LOG_LEVEL", "INFO").upper(),
            format="%(message)s",
            stream=sys.stdout,
            force=True,
        )
        port = int(os.environ.get("ALERT_SINK_PORT", "8080"))
        server = ThreadingHTTPServer(("0.0.0.0", port), AlertSinkHandler)
        server.daemon_threads = True

        def _shutdown(signum: int, _frame: object) -> None:
            LOG.info(json.dumps({"event": "shutting_down", "signal": signum}))
            threading.Thread(target=server.shutdown, daemon=True).start()

        signal.signal(signal.SIGTERM, _shutdown)
        signal.signal(signal.SIGINT, _shutdown)
        LOG.info(json.dumps({"event": "starting", "port": port}))
        server.serve_forever()


    if __name__ == "__main__":
        main()
