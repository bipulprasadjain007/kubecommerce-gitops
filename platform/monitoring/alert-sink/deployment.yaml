# Alert sink Deployment - the local Alertmanager webhook receiver.
#
# Fixed interface: Service `alert-sink` in namespace `observability`, port 8080,
# reached by Alertmanager at
#   http://alert-sink.observability.svc.cluster.local:8080/alerts
#
# The stdlib Python server is mounted from `configmap-script.yaml`; there is no
# image build step. Hardened per the rest of the platform: non-root, read-only
# root filesystem, all capabilities dropped, seccomp RuntimeDefault.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: observability
  labels:
    app.kubernetes.io/name: alert-sink
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/component: alerting
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-sink
        app.kubernetes.io/part-of: kubecommerce
        app.kubernetes.io/component: alerting
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-sink
          image: python:3.12-slim-trixie
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /config/alert_sink.py
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ALERT_SINK_PORT
              value: "8080"
            - name: ALERT_SINK_MAX_ALERTS
              value: "1000"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: alert-sink-script
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
