# Argo CD Application: Grafana Alloy (Kubernetes log collector) for KubeCommerce.
#
# Release name is `alloy` in namespace `observability`, deployed as a DaemonSet.
# Alloy discovers pods in `kubecommerce-*` namespaces, enriches the stream with
# namespace/pod/container/app labels, parses the services' JSON logs (promoting
# `severity`/`service` to labels and `trace_id` to structured metadata) and
# pushes to Loki:
#   http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
#
# Chart provenance (verified 2026-09-26 with `helm repo add` + `helm search`):
#   Grafana Alloy 1.13.0 (appVersion v1.20.0) is published by:
#     https://grafana.github.io/helm-charts
#
# Multi-source `$values`: git source provides the `$values` ref; the Helm source
# consumes platform/logging/alloy-values.yaml.
#
# NOTE (orchestrator): argocd/project.yaml must include the Helm chart repo URL
# below in `spec.sourceRepos`, and must allow `apps/DaemonSet` plus the
# ClusterRole/ClusterRoleBinding that Alloy's cluster-wide RBAC creates.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    # Wave 1: after Loki (wave 0), which owns the push endpoint.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/component: logging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubecommerce
  sources:
    - repoURL: https://github.com/bipulprasadjain007/kubecommerce-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0
      helm:
        valueFiles:
          - $values/platform/logging/alloy-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
