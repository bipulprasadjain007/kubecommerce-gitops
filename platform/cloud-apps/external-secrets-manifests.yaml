# Argo CD Application: ESO custom resources (guide Phase 13, Step 13.2).
#
# Applies the cluster-scoped ClusterSecretStore and the per-environment
# ExternalSecrets under platform/external-secrets/ (including overlays/<env>/).
# These materialise the exact `<service>-secrets` Secrets the Helm chart
# consumes in kubecommerce-<env>.
#
# Sync-wave 1 inside `kubecommerce-platform-cloud`: it runs after the ESO Helm
# chart (wave 0) has installed the external-secrets.io CRDs. If the CRDs are
# still establishing, Argo retries (retry policy below) /
# SkipDryRunOnMissingResource accepts the not-yet-registered kind.
#
# CLOUD-ONLY, MANUAL SYNC: no `automated` block, so this is inert on kind.
#
# Destination namespace `kubecommerce-dev` is only the default for resources
# without an explicit namespace; every ExternalSecret sets its own namespace
# (`kubecommerce-dev|staging|prod`) explicitly. AppProject `kubecommerce`
# already allows all of those destinations.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/component: cloud
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubecommerce
  source:
    repoURL: https://github.com/bipulprasadjain007/kubecommerce-gitops.git
    targetRevision: main
    path: platform/external-secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kubecommerce-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
