# Argo CD Application: External Secrets Operator (guide Phase 13, Step 13.2).
#
# ESO is the AWS delivery mechanism for application credentials: it reads
# AWS Secrets Manager and materialises the `<service>-secrets` Kubernetes
# Secrets the Helm chart consumes (charts/kubecommerce/values.yaml
# `secretEnvFrom`). It is the cloud counterpart of the local, out-of-band
# `make k8s-secrets` workflow (scripts/k8s-dev-secrets.sh).
#
# ---------------------------------------------------------------------------
# CLOUD-ONLY, DELIBERATELY MANUAL SYNC
# ---------------------------------------------------------------------------
# This Application has NO `syncPolicy.automated` block. Nothing is installed
# until an operator (a) supplies the Terraform outputs (region, secret prefix)
# in platform/external-secrets and (b) manually triggers a sync. On the local
# kind cluster it therefore stays OutOfSync and is inert - kind keeps using
# `make k8s-secrets`.
#
# ---------------------------------------------------------------------------
# ORDERING
# ---------------------------------------------------------------------------
# Sync-wave 0 inside the `kubecommerce-platform-cloud` app-of-apps
# (argocd/platform-apps/platform-cloud.yaml): the chart installs the
# external-secrets.io CRDs first; the wave-1 Application
# `platform/cloud-apps/external-secrets-manifests.yaml` then creates the
# ClusterSecretStore and the per-environment ExternalSecrets.
#
# ---------------------------------------------------------------------------
# OUT-OF-SCOPE PREREQUISITE (owner: Argo CD bootstrap / AppProject)
# ---------------------------------------------------------------------------
# For this Application to sync, AppProject `kubecommerce`
# (argocd/project.yaml) must also allow:
#   * sourceRepos: https://charts.external-secrets.io
#   * destinations: namespace `external-secrets` (server in-cluster)
# The required resource KINDS are already whitelisted (CustomResourceDefinition,
# Deployment/Service/ServiceAccount/ConfigMap/Secret,
# ClusterRole/Binding, ValidatingWebhookConfiguration external-secrets.io
# CRDs, PodDisruptionBudget, NetworkPolicy).
# See platform/external-secrets/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: kubecommerce
    app.kubernetes.io/component: cloud
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubecommerce
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # Pinned chart version (appVersion v2.11.0). Do not float.
    targetRevision: 2.11.0
    helm:
      releaseName: external-secrets
      values: |
        # Install the external-secrets.io CRDs with the chart.
        installCRDs: true
        # Single replica each; the portfolio workload is small.
        replicaCount: 1
        # The ClusterSecretStore authenticates with this ServiceAccount via
        # EKS Pod Identity (Terraform association); the name is referenced by
        # platform/external-secrets/cluster-secret-store.yaml (no `auth` block
        # is needed for Pod Identity; IRSA is a documented alternative there).
        serviceAccount:
          create: true
          name: external-secrets
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        webhook:
          replicaCount: 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        certController:
          replicaCount: 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    # Cloud-only namespace. CreateNamespace is enabled so the Application is
    # self-contained; the AppProject must allow this destination (see above).
    namespace: external-secrets
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Deterministic field ownership on large CRDs.
      - ServerSideApply=true
      # The external-secrets.io CRDs are installed in the same sync; accept
      # them missing during the dry-run and let the retry converge.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
